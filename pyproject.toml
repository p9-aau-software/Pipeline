[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recpipe"
version = "0.1.0"
description = "Recommender-system experiment pipeline for AAU AI-LAB"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
